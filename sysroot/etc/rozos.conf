# rozOS settings (phase 14) - help desktop
# mode: desktop = boot into the graphical desktop (rozwm), text = text console
mode=desktop
# time zone as an offset from UTC, for the clock on the desktop (Dhaka = +06:00)
utc_offset=+06:00
# optional picture behind the desktop (.jpg .png .bmp), empty = plain colour
wallpaper=
# boot picture shown before the desktop (empty = none) and for how long (milliseconds)
splash=/usr/share/images/rozos-boot.jpg
splash_ms=1500
