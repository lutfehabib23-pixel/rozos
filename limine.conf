# rozOS — Limine বুটলোডার কনফিগারেশন
# Limine 8.x থেকে এই ফাইলের নাম limine.conf (আগে limine.cfg) এবং "key: value" সিনট্যাক্স।

# বুট মেনুতে কত সেকেন্ড অপেক্ষা করবে (0 = সাথে সাথে বুট)
timeout: 3

# মেনুর এন্ট্রি; '/' দিয়ে শুরু হওয়া লাইন একটি এন্ট্রির নাম
/rozOS
    protocol: limine
    # boot(): যে ডিস্ক/ISO থেকে Limine বুট হয়েছে সেটিই
    path: boot():/boot/rozos.elf
    # কার্নেলের command line (main.c দেখায়)
    cmdline: console=fb,serial
    # ধাপ ৪: initrd (sysroot/ থেকে বানানো USTAR আর্কাইভ) — কার্নেল এটা "/"-এ খোলে
    module_path: boot():/boot/initrd.tar
    module_cmdline: initrd

# ধাপ ৬: /bin/init না চালিয়ে সরাসরি kmon (init-এ সমস্যা হলে কাজে লাগে)
/rozOS (no init)
    protocol: limine
    path: boot():/boot/rozos.elf
    cmdline: console=fb,serial noinit
    module_path: boot():/boot/initrd.tar
    module_cmdline: initrd
