# rozOS — Limine বুটলোডার কনফিগারেশন
# Limine 8.x থেকে এই ফাইলের নাম limine.conf (আগে limine.cfg) এবং "key: value" সিনট্যাক্স।

# বুট মেনুতে কত সেকেন্ড অপেক্ষা করবে (0 = সাথে সাথে বুট)
timeout: 3

# ধাপ ১৯খ-২: মেনু সাদামাটা কালো; লোগো ডেস্কটপের আগে splash-এ ফুটে ওঠে (help boot-menu)

# মেনুর এন্ট্রি; '/' দিয়ে শুরু হওয়া লাইন একটি এন্ট্রির নাম
/rozOS
    protocol: limine
    # boot(): যে ডিস্ক/ISO থেকে Limine বুট হয়েছে সেটিই
    path: boot():/boot/rozos.elf
    # কার্নেলের command line (main.c দেখায়)
    cmdline: console=fb,serial
    # ধাপ ৪: initrd (sysroot/ থেকে বানানো USTAR আর্কাইভ) — কার্নেল এটা "/"-এ খোলে
    module_path: boot():/boot/initrd.tar
    module_cmdline: initrd

# ধাপ ১৪: ডেস্কটপ ছাড়া, সরাসরি টেক্সট কনসোল
/rozOS (text mode)
    protocol: limine
    path: boot():/boot/rozos.elf
    cmdline: console=fb,serial text
    module_path: boot():/boot/initrd.tar
    module_cmdline: initrd

# ধাপ ১৯ঝ: আসল কম্পিউটারে পরীক্ষা — বুটের প্রতিটা ধাপ পর্দায় (কোথায় আটকায় দেখতে), টেক্সট মোড
/rozOS (debug: show every boot step)
    protocol: limine
    path: boot():/boot/rozos.elf
    cmdline: console=fb,serial bootdebug text
    module_path: boot():/boot/initrd.tar
    module_cmdline: initrd

# ধাপ ২৪খ: পেন ড্রাইভের স্থায়ী জায়গা ছাড়া, শুধু RAM-এ (help persistence)
/rozOS (live: do not use or save the persistent storage)
    protocol: limine
    path: boot():/boot/rozos.elf
    cmdline: console=fb,serial nopersist
    module_path: boot():/boot/initrd.tar
    module_cmdline: initrd

# ধাপ ৬: /bin/init না চালিয়ে সরাসরি kmon (init-এ সমস্যা হলে কাজে লাগে)
/rozOS (no init)
    protocol: limine
    path: boot():/boot/rozos.elf
    cmdline: console=fb,serial noinit
    module_path: boot():/boot/initrd.tar
    module_cmdline: initrd
