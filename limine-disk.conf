# rozOS — ডিস্কের boot মেনু (ধাপ ১১খ)। প্রথমবার ডিস্ক বানানোর সময় boot partition-এ
# /limine.conf হিসেবে বসে; তারপর rozOS-এর kinstall এটা নতুন করে লেখে (help kinstall)।
# পথগুলো boot partition (FAT)-এর মূল থেকে — rozOS-এ এটা /boot।

timeout: 3

# ধাপ ১৯খ: বুট পর্দার ছবি (BMP/PNG/JPEG); centered = আসল মাপে মাঝখানে, চারপাশ backdrop রঙ
wallpaper: boot():/boot-wallpaper.jpg
wallpaper_style: centered
backdrop: 000000
# লেখার পেছনে রঙ নয় (ff = পুরো স্বচ্ছ) — ছবি পুরো উজ্জ্বল দেখায়
term_background: ff000000

/rozOS factory (gcc)
    protocol: limine
    path: boot():/rozos-factory.elf
    cmdline: console=fb,serial
    module_path: boot():/initrd.tar
    module_cmdline: initrd

/rozOS factory (text mode, no desktop)
    protocol: limine
    path: boot():/rozos-factory.elf
    cmdline: console=fb,serial text
    module_path: boot():/initrd.tar
    module_cmdline: initrd

/rozOS factory (no init: kernel monitor)
    protocol: limine
    path: boot():/rozos-factory.elf
    cmdline: console=fb,serial noinit
    module_path: boot():/initrd.tar
    module_cmdline: initrd
